[package]
name = "sable-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SABLE: Secure Attested Biometric Library for Edge - Core cryptographic library"

[features]
default = ["std"]
std = []
zk = ["ark-relations", "ark-groth16", "ark-snark"]
halo2 = ["dep:halo2-base", "dep:halo2-ecc", "dep:halo2curves", "dep:snark-verifier-sdk"]
mobile = ["bincode", "serde_json", "zk"]
# REQ-022: SIMD/NEON optimizations for 2x performance improvement
simd = []
neon = ["simd"]

[dependencies]
# Core BLS12-381 operations
blstrs = { workspace = true }
group = { workspace = true }
ff = { workspace = true }

# Arkworks for zk functionality and Poseidon
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-std = { workspace = true }
ark-relations = { workspace = true, optional = true }
ark-groth16 = { workspace = true, optional = true }
ark-snark = { workspace = true, optional = true }
ark-sponge = { workspace = true }
ark-bls12-381 = { workspace = true }

# Halo2 ecosystem (transparent setup ZK proofs)
halo2-base = { workspace = true, optional = true }
halo2-ecc = { workspace = true, optional = true }
halo2curves = { workspace = true, optional = true }
snark-verifier-sdk = { workspace = true, optional = true }

# Cryptographic utilities
getrandom = { workspace = true }
rand_core = { workspace = true }
rand_chacha = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }

# Serialization and error handling
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
thiserror = { workspace = true }

# No-std compatibility
heapless = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
hex-literal = "0.4"

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "zk_performance"
harness = false
required-features = ["zk"]

[[bench]]
name = "energy"
harness = false
required-features = ["mobile"]

[[bench]]
name = "halo2_performance"
harness = false
required-features = ["halo2"]

# Mobile library targets
[lib]
name = "sable_core"
crate-type = ["cdylib", "staticlib", "rlib"]
