version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=demo_server=info,tower_http=info
      - PORT=3000
      - BIND_ADDRESS=0.0.0.0

  frontend:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
