# cbindgen configuration for SABLE mobile FFI
# Generates C headers from Rust FFI code

language = "C"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
namespace = "Sable"

[export]
include = ["SableHandle", "SableErrorCode", "SableResult"]

[export.rename]
"SableHandle" = "SableHandle"
"SableErrorCode" = "SableErrorCode" 
"SableResult" = "SableResult"

[fn]
prefix = "sable_"
postfix = ""
args = "Vertical"
rename_args = "ScreamingSnakeCase"

[struct]
rename_fields = "ScreamingSnakeCase"

[enum]
rename_variants = "ScreamingSnakeCase"

[macro_expansion]
bitflags = true

[parse]
parse_deps = true
include = ["sable-core"]
extra_bindings = ["sable-core"]

[cpp_compat]
enable = false

[documentation]
enabled = true
