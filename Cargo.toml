[workspace]
resolver = "2"
members = [
    "core",
    "demo/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Hugo O'Connor <hugo@anunaresearch.com>"]
repository = "https://github.com/anunaresearch/sable"

[workspace.dependencies]
# BLS12-381 and elliptic curve operations
blstrs = "0.7"
group = "0.13"
ff = "0.13"

# Arkworks ecosystem for zk-SNARKs
ark-ff = "0.3"
ark-ec = "0.3"
ark-std = "0.3"
ark-relations = "0.3"
ark-groth16 = "0.3"
ark-snark = "0.3"
ark-sponge = "0.3"
ark-bls12-381 = "0.3"

# Halo2 ecosystem (transparent setup ZK proofs)
# Note: Poseidon is included in halo2-base as halo2_base::poseidon module
# Using main branch for nightly Rust 1.95+ compatibility
halo2-base = { git = "https://github.com/axiom-crypto/halo2-lib", branch = "main" }
halo2-ecc = { git = "https://github.com/axiom-crypto/halo2-lib", branch = "main" }
halo2curves = "0.7"
snark-verifier = { git = "https://github.com/axiom-crypto/snark-verifier", branch = "main" }
snark-verifier-sdk = { git = "https://github.com/axiom-crypto/snark-verifier", branch = "main" }

# Cryptographic primitives
getrandom = "0.2"
rand_core = "0.6"
rand_chacha = "0.3"
sha2 = "0.10"
zeroize = "1.7"
subtle = "2.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"

# Serialization and error handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
prost = "0.12"
prost-types = "0.12"
thiserror = "1.0"

# Parallelization
rayon = "1.8"

# Testing and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

# FFI
cbindgen = "0.26"

# No-std compatibility
heapless = "0.8"
